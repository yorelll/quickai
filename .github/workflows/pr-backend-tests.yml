name: Backend Tests

on:
  workflow_call:
    inputs:
      head_ref:
        description: 'The head ref of the PR'
        required: false
        type: string

jobs:
  # The 100% coverage gate runs here, on Linux, by design: it was written for a
  # runner where the Win32-only #[cfg(target_os = "windows")] modules are not
  # compiled. Running it on Windows drags those modules into the report and the
  # gate fails (they call Win32 APIs — keyboard hooks, GDI BitBlt, SendInput,
  # schtasks — and cannot be unit-tested).
  coverage:
    name: Backend Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      # Tauri v2 Linux prerequisites. Required before any cargo step: the crate
      # pulls in WebKitGTK/GTK, which is not present on the stock runner image,
      # so compiling it fails with "The system library `gobject-2.0` required by
      # crate `gobject-sys` was not found". Note the 4.1 package (Tauri v2).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly-2026-03-30 --component llvm-tools --no-self-update

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0c7a94999971db56e9df89df226240aab222e776  # v2.75.14
        with:
          tool: cargo-llvm-cov

      # Produce the report first, so it exists even when the gate below fails.
      - name: Backend coverage report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov --ignore-filename-regex "(lib|main)\.rs" --lcov --output-path lcov.info

      # Region-level view: exposes partially-covered lines, which the
      # --fail-under-lines metric counts as missed but --show-missing-lines
      # does not list.
      - name: Backend coverage HTML report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov report --ignore-filename-regex "(lib|main)\.rs" --html --output-dir coverage-html

      # The gate itself, unchanged in strictness. --show-missing-lines prints the
      # uncovered line numbers in the log, so a failing run is self-diagnosing.
      - name: Backend coverage gate (100% lines)
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov report --ignore-filename-regex "(lib|main)\.rs" --fail-under-lines 100 --show-missing-lines

      # Always upload the report, so a red gate can be diagnosed from the
      # uncovered lines instead of re-running the suite blind.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-lcov
          path: src-tauri/lcov.info

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-coverage-html
          path: src-tauri/coverage-html

  # Compiles and runs the backend suite on Windows itself so the Win32-only
  # modules are actually built and their tests executed. Deliberately NO
  # coverage gate — that is enforced by the `coverage` job above.
  windows:
    name: Backend Tests on Windows (no coverage gate)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Type-check all targets (incl. tests and benches)
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib
