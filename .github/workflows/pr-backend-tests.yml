name: Backend Tests

on:
  workflow_call:
    inputs:
      head_ref:
        description: 'The head ref of the PR'
        required: false
        type: string

jobs:
  # The coverage gate runs here, on Linux, by design. The Win32-only
  # #[cfg(target_os = "windows")] modules (keyboard hook, GDI capture,
  # SendInput, schtasks) are not compiled on this runner, so the instrumented
  # set is limited to unit-testable code. The `windows` job below compiles and
  # runs those modules without a coverage gate.
  coverage:
    name: Backend Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      # Tauri v2 Linux prerequisites. Required before any cargo step: the crate
      # pulls in WebKitGTK/GTK, which is not present on the stock runner image,
      # so compiling it fails with "The system library `gobject-2.0` required by
      # crate `gobject-sys` was not found". Note the 4.1 package (Tauri v2).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly-2026-03-30 --component llvm-tools --no-self-update

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-llvm-cov

      # Produce the report first: it is both the gate's input and an artifact,
      # so it must exist even when the gate below fails.
      - name: Backend coverage report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov --ignore-filename-regex "(lib|main)\.rs" --lcov --output-path lcov.info

      # Gate on the exported per-line data rather than llvm-cov's summary line
      # table, which counts region entries as lines and can disagree with the
      # actual execution data.
      - name: Backend coverage gate (every line executed)
        run: bash scripts/check-backend-coverage.sh src-tauri/lcov.info

      # Always upload the report, so a red gate can be diagnosed from the
      # uncovered lines instead of re-running the suite blind.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-lcov
          path: src-tauri/lcov.info

  # Compiles and runs the backend suite on Windows itself so the Win32-only
  # modules are actually built and their tests executed. Deliberately NO
  # coverage gate — that is enforced by the `coverage` job above.
  windows:
    name: Backend Tests on Windows (no coverage gate)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Type-check all targets (incl. tests and benches)
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib
