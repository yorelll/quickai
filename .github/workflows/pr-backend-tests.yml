name: Backend Tests

on:
  workflow_call:
    inputs:
      head_ref:
        description: 'The head ref of the PR'
        required: false
        type: string

jobs:
  # The 100% coverage gate runs here, on Linux, by design: it was written for a
  # runner where the Win32-only #[cfg(target_os = "windows")] modules are not
  # compiled. Running it on Windows drags those modules into the report and the
  # gate fails (they call Win32 APIs — keyboard hooks, GDI BitBlt, SendInput,
  # schtasks — and cannot be unit-tested).
  coverage:
    name: Backend Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly-2026-03-30 --component llvm-tools --no-self-update

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0c7a94999971db56e9df89df226240aab222e776  # v2.75.14
        with:
          tool: cargo-llvm-cov

      - name: Run backend tests with coverage
        working-directory: src-tauri
        run: |
          echo "Running Cargo tests with 100% line coverage enforcement..."
          cargo +nightly-2026-03-30 llvm-cov --ignore-filename-regex "(lib|main)\.rs" --fail-under-lines 100 --lcov --output-path lcov.info

      # Always upload the report, so a red gate can be diagnosed from the
      # uncovered lines instead of re-running the suite blind.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-lcov
          path: src-tauri/lcov.info

  # Compiles and runs the backend suite on Windows itself so the Win32-only
  # modules are actually built and their tests executed. Deliberately NO
  # coverage gate — that is enforced by the `coverage` job above.
  windows:
    name: Backend Tests on Windows (no coverage gate)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Type-check all targets (incl. tests and benches)
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib
