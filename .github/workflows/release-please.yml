name: Release Please

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and upload release assets for (e.g. v0.0.1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open or update release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-cargo-lock:
    name: Sync Cargo.lock into release PR
    needs: release-please
    if: ${{ github.event_name == 'push' && !needs.release-please.outputs.release_created && needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Update Cargo.lock for quickai package
        working-directory: src-tauri
        run: cargo update --package quickai

      - name: Commit Cargo.lock if it changed
        run: |
          if ! git diff --quiet src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "chore: sync Cargo.lock to version bump"
            git push
          else
            echo "Cargo.lock already in sync, nothing to commit"
          fi

  # Resolves which tag is being released, whichever trigger fired, and shares it
  # with every downstream job so they all build and check out the same ref.
  resolve-target:
    name: Resolve target tag
    needs: release-please
    if: ${{ always() && ((github.event_name == 'push' && needs.release-please.outputs.release_created) || github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag="${INPUT_TAG:-${RELEASE_TAG:-${RP_TAG:-}}}"
          if [ -z "$tag" ]; then
            echo "Could not resolve a release tag from inputs.tag, github.event.release.tag_name, or the release-please output." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Target tag: $tag"

  # Lint / format / typecheck plus the two 100% coverage gates. Runs on Linux:
  # the Win32-only #[cfg(target_os = "windows")] modules are not compiled here,
  # so the instrumented set is limited to unit-testable code (see the
  # windows-backend-tests job for the Windows compile/test path).
  quality:
    name: Quality gates (lint, format, typecheck, coverage)
    needs: [release-please, resolve-target]
    if: ${{ always() && needs.resolve-target.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}
          fetch-depth: 1

      # Tauri v2 Linux prerequisites. Required before any cargo step: the crate
      # pulls in WebKitGTK/GTK, which is not present on the stock runner image,
      # so compiling it fails with "The system library `gobject-2.0` required by
      # crate `gobject-sys` was not found". Note the 4.1 package (Tauri v2).
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --component clippy --component rustfmt --no-self-update

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly-2026-03-30 --component llvm-tools --no-self-update

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0c7a94999971db56e9df89df226240aab222e776  # v2.75.14
        with:
          tool: cargo-llvm-cov

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint && bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests with 100% coverage enforcement
        run: bun run test:coverage

      # Produce the report first: it is both the gate's input and an artifact,
      # so it must exist even when the gate below fails.
      - name: Backend coverage report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov --ignore-filename-regex "(lib|main)\.rs" --lcov --output-path lcov.info

      # Region-level view (line and region colouring), for cross-checking the
      # lcov-derived gate.
      - name: Backend coverage HTML report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov report --ignore-filename-regex "(lib|main)\.rs" --html --output-dir coverage-html

      # Region-level data (segments), for cross-checking the lcov-derived gate.
      - name: Backend coverage JSON report
        working-directory: src-tauri
        run: cargo +nightly-2026-03-30 llvm-cov report --ignore-filename-regex "(lib|main)\.rs" --json --output-path coverage.json

      # Gate on the exported per-line data rather than llvm-cov's summary line
      # table, which counts region entries as lines and disagrees with every
      # export (see the coverage JSON/HTML artifacts).
      - name: Backend coverage gate (every line executed)
        run: bash scripts/check-backend-coverage.sh src-tauri/lcov.info

      # Always upload the report, so a red gate can be diagnosed from the
      # uncovered lines instead of re-running the suite blind.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-lcov
          path: src-tauri/lcov.info

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-coverage-html
          path: src-tauri/coverage-html

      - name: Upload coverage JSON report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: backend-coverage-json
          path: src-tauri/coverage.json

  # Compiles and runs the backend test suite on Windows itself, so the
  # Win32-only modules (keyboard hook, GDI capture, SendInput, autostart) are
  # actually built and exercised here. Deliberately NO coverage gate: that gate
  # is enforced in the `quality` job on Linux.
  windows-backend-tests:
    name: Backend tests on Windows (no coverage gate)
    needs: [release-please, resolve-target]
    if: ${{ always() && needs.resolve-target.outputs.tag != '' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}
          fetch-depth: 1

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Type-check all targets (incl. tests and benches)
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib

  build-and-release:
    name: Build and publish Windows app
    needs: [release-please, resolve-target, quality, windows-backend-tests]
    # Run when: release-please just created a release (push to main), a GitHub
    # Release was published (covers the manual first release and re-releases),
    # or the workflow was dispatched on demand with a tag input. `always()` is
    # required so this job is not auto-skipped when the release-please job is
    # skipped on the release / workflow_dispatch events. The `result == 'success'`
    # checks are what make a red gate block the build.
    if: ${{ always() && needs.quality.result == 'success' && needs.windows-backend-tests.result == 'success' && needs.resolve-target.outputs.tag != '' }}
    # Deduplicate the release-please-created release: its push run and its
    # `release: published` run resolve to the same tag and thus the same group,
    # so only one build survives.
    concurrency:
      group: release-build-${{ needs.resolve-target.outputs.tag }}
      cancel-in-progress: true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --no-self-update

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app (NSIS installer)
        env:
          VITE_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bun run build:backend

      - name: Create portable zip
        shell: pwsh
        run: |
          $tag = "${{ needs.resolve-target.outputs.tag }}"
          $version = $tag -replace '^v', ''
          $exe = "src-tauri\target\release\quickai.exe"
          if (-not (Test-Path $exe)) {
            throw "Standalone binary not found at $exe"
          }
          $zip = "QuickAI_${version}_x64_portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.resolve-target.outputs.tag }}"
          $version = $tag -replace '^v', ''
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under src-tauri\target\release\bundle\nsis"
          }
          $zip = "QuickAI_${version}_x64_portable.zip"
          Write-Host "Uploading $($installer.Name) and $zip to $tag"
          gh release upload $tag $installer.FullName $zip --clobber
