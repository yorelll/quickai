[package]
name = "quickai"
version = "0.0.8"
description = "QuickAI: a cloud-only, bilingual AI assistant overlay for Windows"
authors = ["ayzekhdawy", "yorelll"]
license = "Apache-2.0"
repository = "https://github.com/yorelll/quickai"
homepage = "https://github.com/yorelll/quickai"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quickai_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio = { version = "1.52.0", features = ["macros", "sync", "time"] }
futures-util = "0.3.32"
tokio-util = "0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.23"
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2"
parking_lot = "0.13"
toml = "1.0"
toml_edit = "0.25"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
